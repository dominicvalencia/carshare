name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://carrental_test:carrental_test@localhost:5432/carrental_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      TOKEN_HASH_SECRET: ci-token-hash-secret-at-least-thirty-two-characters
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:3001
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: carrental_test
          POSTGRES_PASSWORD: carrental_test
          POSTGRES_USER: carrental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carrental_test -d carrental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test:integration
